function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}

function riverDist(x,z){let best=1e9;for(let i=0;i<RIVER.length-1;i++){const [ax,az]=RIVER[i],[bx,bz]=RIVER[i+1];const vx=bx-ax,vz=bz-az;let t=((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz);t=Math.max(0,Math.min(1,t));const dx=x-(ax+vx*t),dz=z-(az+vz*t);best=Math.min(best,Math.hypot(dx,dz))}return best}
function height0(x,z){

 // baie sud (port) : creuse la côte
 const bd=Math.hypot(x+70,z-235); if(bd<55) h=Math.min(h, -2+(bd/55)*4*0);
 return h}

function height(x,z){let h=heightT(x,z);for(const p of PADS){const dx=x-p.x,dz=z-p.z,lx=dx*p.c-dz*p.s-p.cx,lz=dx*p.s+dz*p.c-p.cz;const e=Math.hypot(Math.max(Math.abs(lx)-p.hw,0),Math.max(Math.abs(lz)-p.hd,0));if(e<18){const w=1-e/18,k=w*w*(3-2*w);h=h+(p.h-h)*k}}return h}
function heightT(x,z){const h=height0(x,z);if(!TOWN)return h;const d=Math.hypot(x-TOWN.x,z-TOWN.z);if(d>TOWN.R+16)return h;
 const flat=TOWN.h+(h-TOWN.h)*(d<15?0:Math.min(.32,(d-15)*.03));const w=d<TOWN.R?1:1-(d-TOWN.R)/16;const k=w*w*(3-2*w);return h+(flat-h)*k}

for(let i=0;i<40000&&k<N;i++){const x=(hash(i,1)-.5)*560,z=(hash(i,2)-.5)*560;const h=height(x,z);if(h<3||h>40)continue;if(riverDist(x,z)<12)continue;

 tcol.set(hash(i,6)>.5?'#2f7d3a':'#3b8f3f').offsetHSL(0,0,(hash(i,7)-.5)*.08);trees.setColorAt(k,tcol);k++}

function ghostBuildings(cx,cz,n,spread,seed,maxH=24){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:'#ffffff',transparent:true,opacity:.35,depthWrite:false});const lm=new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:.9});

 c.fillStyle=col;c.beginPath();c.arc(128,110,95,0,7);c.fill();c.beginPath();c.moveTo(60,170);c.lineTo(196,170);c.lineTo(128,250);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(128,110,72,0,7);c.fill();

 else if(f==='volcan_lave'){const L=s.couleur||'#ff6a1a';const gl=c.createRadialGradient(x,y-r*.5,2,x,y-r*.5,r*1.1);gl.addColorStop(0,'rgba(255,140,40,.75)');gl.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=gl;c.beginPath();c.arc(x,y-r*.3,r*1.1,0,7);c.fill();
  c.beginPath();c.moveTo(x-r*1.05,y+r*.62);c.lineTo(x-r*.24,y-r*.42);c.lineTo(x+r*.24,y-r*.42);c.lineTo(x+r*1.05,y+r*.62);c.closePath();c.fillStyle='#6b2e1c';c.fill();c.strokeStyle='#e6c9a0';c.lineWidth=r*.05;c.stroke();
  c.strokeStyle=L;c.lineCap='round';for(const [x1,y1,x2,y2,wd] of [[-.12,-.42,-.55,.45,.13],[.1,-.42,.5,.5,.11],[0,-.42,-.05,.55,.15]]){c.lineWidth=r*wd;c.beginPath();c.moveTo(x+x1*r,y+y1*r);c.quadraticCurveTo(x+(x1+x2)*.5*r+r*.08,y+(y1+y2)*.5*r,x+x2*r,y+y2*r);c.stroke()}
  c.fillStyle=L;for(const [dx,dy,rs] of [[0,-.62,.2],[.2,-.82,.14],[-.18,-.8,.13],[.05,-1.0,.1]]){c.beginPath();c.arc(x+dx*r,y+dy*r,rs*r,0,7);c.fill()}c.fillStyle='#ffd34d';c.beginPath();c.arc(x,y-r*.55,r*.09,0,7);c.fill()}
 else if(f==='cercle'){c.beginPath();c.arc(x,y,r*.8,0,7);c.fill()}
 else if(f==='soleil'){c.beginPath();c.arc(x,y,r*.5,0,7);c.fill();c.lineWidth=r*.12;for(let i=0;i<12;i++){const a=i*Math.PI/6;c.beginPath();c.moveTo(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62);c.lineTo(x+Math.cos(a)*r*.95,y+Math.sin(a)*r*.95);c.stroke()}}
 else if(f==='lune'){c.beginPath();c.arc(x,y,r*.8,0,7);c.fill();c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x+r*.35,y-r*.15,r*.7,0,7);c.fill()}
 else if(f==='volcan'){c.beginPath();c.moveTo(x-r,y+r*.8);c.lineTo(x-r*.25,y-r*.5);c.lineTo(x+r*.25,y-r*.5);c.lineTo(x+r,y+r*.8);c.closePath();c.fill();c.globalAlpha=.85;[[0,-.75,.22],[.15,-1.05,.28],[-.1,-1.35,.32]].forEach(([dx,dy,rs])=>{c.beginPath();c.arc(x+dx*r,y+dy*r,rs*r,0,7);c.fill()})}
 else if(f==='palmier'){c.lineWidth=r*.16;c.beginPath();c.moveTo(x,y+r*.9);c.quadraticCurveTo(x+r*.25,y,x,y-r*.45);c.stroke();for(let i=0;i<5;i++){const a=-Math.PI+i*Math.PI/4;c.beginPath();c.moveTo(x,y-r*.45);c.quadraticCurveTo(x+Math.cos(a)*r*.6,y-r*.45+Math.sin(a)*r*.6-r*.25,x+Math.cos(a)*r*.95,y-r*.45+Math.sin(a)*r*.5+r*.1);c.stroke()}}

};
function progAbs(t,k){const g=TL.grow&&TL.grow[k];if(!g)return 1;return Math.max(0,Math.min(1,(t-g[0])/(g[1]-g[0])))}
function lerp(a,b,t){return a+(b-a)*t}function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function camAt(t){const shots=TL.shots;let i=0;while(i<shots.length-1&&t>=shots[i+1].t)i++;const s=shots[i],e=(shots[i+1]?shots[i+1].t:TL.dur);const p=Math.max(0,Math.min(1,(t-s.t)/(e-s.t)));const q=s.ease===false?p:ease(p);
 const a=s.from,b=s.to;const P=new THREE.Vector3(...a.p).lerp(new THREE.Vector3(...b.p),q);const L=new THREE.Vector3(...a.l).lerp(new THREE.Vector3(...b.l),q);if(s.rel){P.y+=Math.max(0,height(P.x,P.z));L.y+=Math.max(0,height(L.x,L.z))}return {P,L,s,p}}

 // éléments selon le temps

 city.children.forEach(b=>{const g=TL.prog(t,'ville');const v=Math.max(0,Math.min(1,(g*1.4-b.userData.d)*4));b.scale.set(1,v||.0001,1);b.visible=v>0});
 villA.children.forEach(b=>{const g=TL.prog(t,'villA');const v=Math.max(0,Math.min(1,(g*1.4-b.userData.d)*4));b.scale.set(1,v||.0001,1);b.visible=v>0});
 villB.children.forEach(b=>{const g=TL.prog(t,'villB');const v=Math.max(0,Math.min(1,(g*1.4-b.userData.d)*4));b.scale.set(1,v||.0001,1);b.visible=v>0});

 for(const g of extras){if(g.isGroup&&g.children[0]&&g.children[0].isSprite){g.visible=TL.vis(t,g.userData.key);g.position.y=g.userData.h0+6+Math.sin(t*3)*1.5}else{const pr=TL.prog(t,g.userData.key);g.children.forEach(b=>{const v=Math.max(0,Math.min(1,(pr*1.4-b.userData.d)*4));b.scale.set(1,v||.0001,1);b.visible=v>0})}}
 if(capitale){const pr=progAbs(t,'capitale');capitale.children.forEach(b=>{const v=Math.max(0,Math.min(1,(pr*1.5-b.userData.d)*3));b.scale.set(1,v||.0001,1);b.visible=v>0})}
 for(const g of speciaux){g.traverse(o=>{if(o.userData&&o.userData.barber)o.userData.barber.offset.y=-t*.6});if(g.userData.flotte){g.position.y=g.userData.y0+Math.sin(t*1.4)*.35;g.rotation.z=Math.sin(t*1.1)*.04}const pr=g.userData.key?progAbs(t,g.userData.key):1;const v=g.userData.monde?1:ease(Math.max(0,Math.min(1,pr)));g.userData.inner.scale.set(1,v||.0001,1);g.visible=pr>0;g.userData.sp.visible=pr>.85;g.userData.sp.material.opacity=Math.min(1,(pr-.85)*8)}
 bougerGens(t);bougerEnnemi(t);bougerJ7(t);bougerJ11(t);bougerJ12(t);bougerJ13(t);
 for(const g of speciaux)if(g.userData.karts)for(const m of g.userData.karts){const K=m.userData.kart,a=-(t*.35+K.ph)*Math.PI*2,x=Math.cos(a)*K.RX,z=Math.sin(a)*K.RZ*(1+.35*Math.sin(a*2)),a2=a-.05,x2=Math.cos(a2)*K.RX,z2=Math.sin(a2)*K.RZ*(1+.35*Math.sin(a2*2));m.position.set(x,0,z);m.rotation.y=Math.atan2(-(z2-z),x2-x)}
 flagG.visible=TL.vis(t,'drapeau')||(!!(TL.etat&&TL.etat.capitale)&&!TL.vis(t,'sansDrapeau'));toi.visible=TL.vis(t,'toi');toi.children.forEach(c=>c.material.emissiveIntensity=.5+.4*Math.sin(t*5));
 renderer.render(scene,cam);
 X.clearRect(0,0,W,H);X.drawImage(renderer.domElement,0,0);

  if(typeof st.pop==='object'){const q=Math.max(0,Math.min(1,(t-st.pop.t0)/(st.pop.t1-st.pop.t0)));st.pop=Math.round(st.pop.de+(st.pop.a-st.pop.de)*ease(q))}hud(st)}
 for(const c of TL.cards) if(t>=c.t0&&t<c.t1){const k=Math.min(1,(t-c.t0)/.35)*Math.min(1,(c.t1-t)/.25);CARDS[c.kind](k,t,{...(c.data||{}),t0:c.t0})}
 for(const B of TL.bandeaux||[]) if(t>=B.t0&&t<B.t1)bandeau(B);
 for(const c of TL.caps) if(t>=c.t0&&t<c.t1){const k0=Math.min(1,(t-c.t0)/.18);const k=k0<1?.7+.3*k0+Math.sin(k0*Math.PI)*.15:1;caption(c.lines,c.y||560,k)}
 // flash blanc aux transitions marquées
 for(const f of TL.flashes) if(t>=f&&t<f+.25){X.fillStyle=`rgba(255,255,255,${1-(t-f)/.25})`;X.fillRect(0,0,W,H)}
 return out.toDataURL('image/jpeg',.9)};
