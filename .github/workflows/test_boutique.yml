name: Test du serveur de paiement
on:
  workflow_dispatch:
    inputs: {url: {default: "https://lepaysdetous.vercel.app"}}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "site: %{http_code}\n" "${{ inputs.url }}/"
          curl -s -X POST "${{ inputs.url }}/api/panier" -H 'Content-Type: application/json' -H 'Origin: https://lepaysdetous.github.io' -d '{"maison":"petite","lot":35,"options":["piscine"],"statue":true,"ref":"P35-test"}' | sed -E 's#(https://checkout.stripe.com/c/pay/[^"]{0,30})[^"]*#\1…#'
