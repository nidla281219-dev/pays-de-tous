name: Images Kie.ai (textures du jeu)
on:
  workflow_dispatch:
    inputs:
      spec: {description: "fichier de demandes (JSON)", default: "studio/jeu/textures.json"}
      seuls: {description: "noms à (re)faire, séparés par des virgules (vide = tous)", default: ""}
permissions:
  contents: write
jobs:
  k:
    runs-on: ubuntu-latest
    env:
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q numpy pillow
      - run: python studio/kie_images.py "${{ inputs.spec }}" "${{ inputs.seuls }}"
      - run: |
          git config user.name "Pays de Tous bot"; git config user.email "actions@github.com"
          git add studio/jeu; git diff --cached --quiet || (git commit -m "Images Kie.ai : ${{ inputs.spec }}" && git pull --rebase -q && git push)
