name: Publier sur YouTube (rapide, 6 morceaux en parallèle)
on:
  workflow_dispatch:
    inputs:
      jour: {description: "numéro du jour", default: "1"}
      heure: {description: "heure de publication (heure suisse, publié tout de suite si passée)", default: "17:00"}
permissions:
  contents: write
concurrency: {group: publier-rapide, cancel-in-progress: false}
jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: {k: [1, 2, 3, 4, 5, 6]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          { pip install -q --break-system-packages imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          npm install --no-audit --no-fund && (timeout 90 npx playwright install --with-deps chromium || npx playwright install chromium)
          cd studio && node render.js --jour ${{ inputs.jour }} --morceau ${{ matrix.k }}/6 morceau_${{ matrix.k }}.mp4
      - uses: actions/upload-artifact@v4
        with: {name: "morceau_${{ matrix.k }}", path: "studio/morceau_${{ matrix.k }}.mp4", retention-days: 2}
  publier:
    needs: rendu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests && { pip install -q --break-system-packages imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
      - uses: actions/download-artifact@v4
        with: {path: morceaux, merge-multiple: true}
      - name: Assembler + son
        run: |
          for k in 1 2 3 4 5 6; do echo "file '$PWD/morceaux/morceau_$k.mp4'"; done > liste.txt
          ffmpeg -v error -y -f concat -safe 0 -i liste.txt -c copy studio/pays_j${{ inputs.jour }}_video.mp4
          cd studio && python mix.py ${{ inputs.jour }}
      - run: python studio/publier.py verifier
      - name: Envoi YouTube
        run: python studio/publier.py publier "${{ inputs.jour }}" studio/le_pays_de_tous_jour${{ inputs.jour }}.mp4 "${{ inputs.heure }}"
      - run: cp studio/le_pays_de_tous_jour${{ inputs.jour }}.mp4 jours/jour${{ inputs.jour }}/video.mp4
      - if: always()
        run: |
          git config user.name "Pays de Tous bot"; git config user.email "actions@github.com"
          git add jours; git diff --cached --quiet || (git commit -m "Jour ${{ inputs.jour }} envoyé sur YouTube (rapide)" && git pull --rebase -q && git push)
